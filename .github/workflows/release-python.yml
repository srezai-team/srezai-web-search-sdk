name: Release Python

# Публикация по тегу вида py-v0.1.0. Тег для Python отделён от тега для JS:
# пакеты живут в одном репозитории, но версии у них свои.
on:
  push:
    tags: ["py-v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Прогон перед публикацией: релиз с PyPI не отзывается, версию не занять
      # повторно. Дешевле упасть здесь.
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: mypy src
      - run: pytest -q

      - run: pip install build
      - run: python -m build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: python/dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    # OIDC вместо долгоживущего токена: секрет, которого нет, нельзя украсть.
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
