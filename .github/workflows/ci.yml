name: CI

on:
  push:
    branches: [main]
  pull_request:

# Каждый SDK проверяется своей матрицей, но в одном workflow: контракт у них
# общий, и расходиться версии не должны.
jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    strategy:
      fail-fast: false
      matrix:
        version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.version }}
      - run: pip install -e ".[dev]"
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy src
      - run: pytest -q

      # Ставим собранный пакет отдельно, без dev-зависимостей: так ловится
      # необъявленная зависимость. В dev-окружении она приезжает попутно с
      # линтерами, и пакет «работает» до первой установки у пользователя.
      - run: pip install build && python -m build
      - run: |
          python -m venv /tmp/fresh
          /tmp/fresh/bin/pip install --quiet dist/*.whl
          /tmp/fresh/bin/python -c "from srezai import SrezAI; import srezai; print(srezai.__version__)"

  js:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: js
    strategy:
      fail-fast: false
      matrix:
        version: ["18", "20", "22"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.version }}
          cache: npm
          cache-dependency-path: js/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
